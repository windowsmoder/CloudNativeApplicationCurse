name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-backend:
    name: Build Backend
    runs-on: self-hosted

    defaults:
      run:
        shell: bash
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Start server
        env:
          DATABASE_URL: postgresql://fake:fake@localhost:5432/fake_db?schema=public
          PORT: 3456
        run: |
          npm run start &
          SERVER_PID=$!
          sleep 10

          if ps -p $SERVER_PID > /dev/null; then
            echo "Le serveur a bien démarré."
            kill $SERVER_PID
          else
            echo "Le serveur ne tourne plus."
            exit 1
          fi

  build-frontend:
    name: Build Frontend
    runs-on: self-hosted

    defaults:
      run:
        shell: bash
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build production
        run: npm run build
